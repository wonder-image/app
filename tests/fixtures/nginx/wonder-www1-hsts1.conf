# WONDER NGINX START
# Generato da `forge build --nginx`: non modificare a mano, viene riscritto a ogni build.
# Fonte delle regole: Wonder\Console\Commands\Build (le stesse del .htaccess).
#
# Contratto con il vhost:
#  - includere questo file dentro `server { }`, PRIMA della location dei `.php`;
#  - la location dei `.php` deve passare a PHP-FPM e, se il file non esiste,
#    rimandare a /handler/index.php (`try_files $uri /handler/index.php;`);
#  - `root`, `index`, TLS, redirect http→https, gzip e IP Cloudflare restano al vhost.

charset utf-8;
fastcgi_hide_header X-Powered-By;

# Forza WWW fuori dall'ambiente locale (--force-www)
if ($host !~* "^(?:www\.|localhost$|127\.0\.0\.1$)") {
    return 301 https://www.$host$request_uri;
}

# Cache degli asset: con ?v=123 è immutabile (usata nelle location sotto)
set $wonder_cache_control "public, max-age=86400, must-revalidate";
if ($arg_v ~ "^[0-9]+$") {
    set $wonder_cache_control "public, max-age=31536000, immutable";
}

# Cartelle mai servite via HTTP
location = /.git { return 403; }
location ^~ /.git/ { return 403; }
location = /.audit { return 403; }
location ^~ /.audit/ { return 403; }
location = /storage { return 403; }
location ^~ /storage/ { return 403; }
location = /state { return 403; }
location ^~ /state/ { return 403; }
location = /tests { return 403; }
location ^~ /tests/ { return 403; }
location = /docs { return 403; }
location ^~ /docs/ { return 403; }
location = /node_modules { return 403; }
location ^~ /node_modules/ { return 403; }
location = /lang { return 403; }
location ^~ /lang/ { return 403; }
location = /handler/storage { return 403; }
location ^~ /handler/storage/ { return 403; }

# Caricamenti: mai eseguiti né serviti come script
location ^~ /assets/upload/ {
    location ~* "(?:\.(?:php\d?|phtml|phar|phps|pht|cgi|pl|py|sh)(?:\.|$)|/\.ht[^/]*$)" { return 403; }
    location ~* "(?:^|/)(?:\.env[^/]*|\.git[^/]*|\.ht[^/]*|[^/]*\.log(\.\d+)?|[^/]*\.sql(\.gz)?|[^/]*\.(bak|old|orig|swp)|[^/]*~|composer\.(json|lock)|package(-lock)?\.json|skills-lock\.json|sync-data\.json|generator\.conf|forge)$" { return 403; }
    location ~* "\.svgz?$" {
        try_files $uri @wonder_router;
        add_header Cache-Control $wonder_cache_control;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "sandbox";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)";
        add_header Strict-Transport-Security "max-age=31536000";
    }
    location ~* "\.(?:jpe?g|png|gif|webp|avif|svg|ico|pdf|mp4|webm|ogg|woff2?|js|css)$" {
        try_files $uri @wonder_router;
        add_header Cache-Control $wonder_cache_control;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)";
        add_header Strict-Transport-Security "max-age=31536000";
    }
    try_files $uri @wonder_router;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)";
    add_header Strict-Transport-Security "max-age=31536000";
}

# Rotte sempre gestite dal router (esistono anche come cartelle)
location ~* "^/(?:backend|api|oauth|\.well-known/oauth-[a-z-]+)(?:/.*)?$" {
    rewrite ^ /handler/index.php last;
}

# File che non devono mai essere serviti
location ~* "(?:^|/)(?:\.env[^/]*|\.git[^/]*|\.ht[^/]*|[^/]*\.log(\.\d+)?|[^/]*\.sql(\.gz)?|[^/]*\.(bak|old|orig|swp)|[^/]*~|composer\.(json|lock)|package(-lock)?\.json|skills-lock\.json|sync-data\.json|generator\.conf|forge)$" { return 403; }

# Archivi e backup negati ovunque tranne nei file caricati
location ~* "^/(?!assets/upload/).*\.(?:zip|tgz|tar(\.gz)?)$" { return 403; }

# xml-sitemaps: nginx ignora il suo data/.htaccess, queste regole ne fanno le veci
location ~* "^/vendor/wonder-image/app/vendor-static/xml-sitemaps/data/(?!.*\.(?:txt|html|gz|jpg|png|gif)$)" { return 403; }
location ~* "^/vendor/wonder-image/app/vendor-static/xml-sitemaps/(?:pages/|.*\.conf$)" { return 403; }

# vendor/ negata, tranne gli asset statici dei pacchetti e il generatore xml-sitemaps
location ~* "^/vendor(?:/|$)(?![^/]+/[^/]+/resources/assets/(?:[^/.]+/)*(?![^/]*\.(?:php\d?|phtml|phar|pht|phps|cgi|pl|py|sh)(?:\.|$))[^/]+\.(?:css|js|map|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$|wonder-image/app/vendor-static/xml-sitemaps(/|$))" { return 403; }

# Cache: pagine html sempre rivalidate
location ~* "\.(?:html|htm)$" {
    try_files $uri @wonder_router;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)";
    add_header Strict-Transport-Security "max-age=31536000";
}

# Cache: asset statici (con ?v=123 la cache è immutabile)
location ~* "\.(?:jpe?g|png|gif|webp|avif|svg|ico|pdf|mp4|webm|ogg|woff2?|js|css)$" {
    try_files $uri @wonder_router;
    add_header Cache-Control $wonder_cache_control;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)";
    add_header Strict-Transport-Security "max-age=31536000";
}

# La homepage entra sempre nel router
location = / {
    rewrite ^ /handler/index.php last;
}

# Tutto il resto: file o cartella esistente, altrimenti il router
location / {
    try_files $uri $uri/ @wonder_router;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)";
    add_header Strict-Transport-Security "max-age=31536000";
}

location @wonder_router {
    # /handler non passa dal router (404 se il file non esiste)
    if ($uri ~* "^/handler(?:/|$)") {
        return 404;
    }
    # Aggiunge lo slash finale (solo per URL senza estensione)
    if ($uri ~ "^(?!.*/$)(?!.*\.[^./]+$)") {
        rewrite ^(.*)$ $1/ permanent;
    }
    rewrite ^ /handler/index.php last;
}
# WONDER NGINX END
